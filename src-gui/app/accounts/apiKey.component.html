<div
  class="tw-flex tw-min-h-screen tw-items-center tw-justify-center tw-bg-background-alt tw-px-4 tw-py-10"
>
  <form
    #form="appApiAction"
    (ngSubmit)="submit()"
    [appApiAction]="formPromise()"
    class="tw-w-full tw-max-w-md"
  >
    <div class="tw-mb-6 tw-flex tw-flex-col tw-items-center tw-text-center">
      <bit-icon-tile icon="bwi-shield" size="xl" emphasis="bold" class="tw-mb-4"></bit-icon-tile>
      <h1 bitTypography="h3">{{ "welcome" | i18n }}</h1>
      <p bitTypography="body2" class="tw-text-muted">{{ "logInDesc" | i18n }}</p>
    </div>
    <bit-card>
      <bit-form-field>
        <bit-label>{{ "clientId" | i18n }}</bit-label>
        <input
          bitInput
          id="client_id"
          name="ClientId"
          [ngModel]="clientId()"
          (ngModelChange)="clientId.set($event)"
        />
      </bit-form-field>
      <bit-form-field>
        <bit-label>{{ "clientSecret" | i18n }}</bit-label>
        <input
          bitInput
          type="password"
          id="client_secret"
          name="ClientSecret"
          [ngModel]="clientSecret()"
          (ngModelChange)="clientSecret.set($event)"
        />
        <button type="button" bitIconButton bitSuffix bitPasswordInputToggle></button>
      </bit-form-field>
      <button type="submit" bitButton buttonType="primary" block [loading]="form.loading()">
        {{ "logIn" | i18n }}
      </button>
    </bit-card>
    <div class="tw-mt-4 tw-text-center">
      <button type="button" bitLink linkType="primary" (click)="settings()">
        {{ "settings" | i18n }}
      </button>
    </div>
  </form>
</div>
