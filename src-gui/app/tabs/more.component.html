<div class="tw-grid tw-grid-cols-1 tw-items-start tw-gap-6 lg:tw-grid-cols-2">
  <bit-section disableMargin>
    <bit-section-header>
      <h2 bitTypography="h6">{{ "about" | i18n }}</h2>
    </bit-section-header>
    <bit-card>
      <div class="tw-mb-4 tw-flex tw-items-center tw-gap-4">
        <bit-icon-tile icon="bwi-shield" size="lg" emphasis="bold"></bit-icon-tile>
        <div>
          <p bitTypography="body1" class="tw-mb-0 tw-font-medium">
            {{ "bitwardenDirectoryConnector" | i18n }}
          </p>
          <p bitTypography="body2" class="tw-mb-0 tw-text-muted">
            {{ "version" | i18n: version() }}
          </p>
        </div>
      </div>
      <p bitTypography="helper" class="tw-text-muted">
        &copy; Bitwarden Inc. LLC 2015-{{ year() }}
      </p>
      <button
        type="button"
        bitButton
        buttonType="secondary"
        [loading]="checkingForUpdate()"
        (click)="update()"
      >
        {{ "checkForUpdates" | i18n }}
      </button>
    </bit-card>
  </bit-section>
  <bit-section disableMargin>
    <bit-section-header>
      <h2 bitTypography="h6">{{ "other" | i18n }}</h2>
    </bit-section-header>
    <bit-card>
      <div class="tw-flex tw-flex-wrap tw-gap-2">
        <button type="button" bitButton buttonType="secondary" (click)="logOut()">
          {{ "logOut" | i18n }}
        </button>
        <button type="button" bitButton buttonType="secondary" (click)="clearCache()">
          {{ "clearSyncCache" | i18n }}
        </button>
      </div>
    </bit-card>
  </bit-section>
</div>
