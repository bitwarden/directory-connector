<div class="tw-flex tw-h-screen tw-min-h-0">
  <!-- Mirrors the look of the clients' bit-side-nav, which isn't vendored (it depends on
  feature flags and global state that Directory Connector doesn't have). -->
  <nav
    class="tw-flex tw-w-60 tw-shrink-0 tw-flex-col tw-bg-bg-nav tw-text-fg-nav"
    [attr.aria-label]="'bitwardenDirectoryConnector' | i18n"
  >
    <div
      class="tw-flex tw-h-16 tw-shrink-0 tw-items-center tw-gap-2 tw-border-0 tw-border-b tw-border-solid tw-border-border-nav-divider tw-px-5"
    >
      <i class="bwi bwi-shield tw-text-2xl" aria-hidden="true"></i>
      <span class="tw-font-semibold tw-leading-tight">
        {{ "bitwardenDirectoryConnector" | i18n }}
      </span>
    </div>
    <ul class="tw-m-0 tw-flex tw-list-none tw-flex-col tw-gap-1 tw-p-3">
      @for (item of navItems; track item.path) {
        <li>
          <a
            [routerLink]="item.path"
            routerLinkActive
            #rla="routerLinkActive"
            ariaCurrentWhenActive="page"
            class="tw-flex tw-h-10 tw-items-center tw-gap-3 tw-rounded-xl tw-px-3 !tw-text-fg-nav tw-no-underline hover:tw-bg-bg-nav-hover focus-visible:tw-outline-none focus-visible:tw-ring-2 focus-visible:tw-ring-inset focus-visible:tw-ring-border-nav-focus"
            [ngClass]="{ 'tw-bg-bg-nav-hover tw-font-semibold': rla.isActive }"
          >
            <i class="bwi {{ item.icon }} bwi-fw tw-text-lg" aria-hidden="true"></i>
            {{ item.label | i18n }}
          </a>
        </li>
      }
    </ul>
  </nav>
  <main class="tw-flex tw-min-w-0 tw-flex-1 tw-flex-col tw-bg-background-alt">
    <header
      class="tw-flex tw-h-16 tw-shrink-0 tw-items-center tw-border-0 tw-border-b tw-border-solid tw-border-secondary-300 tw-bg-background tw-px-8"
    >
      <h1 bitTypography="h3" noMargin>{{ pageTitle() | i18n }}</h1>
    </header>
    <div class="tw-min-h-0 tw-flex-1 tw-overflow-y-auto">
      <div class="tw-mx-auto tw-max-w-5xl tw-px-8 tw-py-6">
        <router-outlet></router-outlet>
      </div>
    </div>
  </main>
</div>
