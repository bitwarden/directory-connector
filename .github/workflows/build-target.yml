# This workflow runs all pull requests through the target branch context so that secrets are
# available for signing artifacts.
# Same-repo PRs build automatically on open, push, and reopen.
# Fork PRs only build when a user with write access adds the "ci:signed-build" label. Pushes to the PR
# branch (including "Update branch") do not trigger it. The label is removed once the build starts, so
# every new commit needs to be reviewed and labeled again.
# Only add the label after reviewing the PR to ensure that no malicious code has been introduced,
# as it allows the code on the forked branch to have access to workflow secrets.

name: Build (Fork PR)

on:
  pull_request_target:
    types: [opened, synchronize, reopened, labeled]
    branches:
      - main
    paths:
      - 'src/**'
      - 'src-cli/**'
      - 'libs/**'
      - 'native/**'
      - 'jslib/**'
      - 'resources/**'
      - 'scripts/**'
      - 'package.json'
      - 'package-lock.json'
      - 'tsconfig.json'
      - 'angular.json'
      - '.github/workflows/build.yml'
      - '.github/workflows/build-target.yml'
      - '.github/actions/**'
      - '!*.md'
      - '!*.txt'

permissions: {}

jobs:
  check-run:
    name: Check PR run
    if: ${{ github.event.action == 'labeled' && github.event.label.name == 'ci:signed-build' && github.event.pull_request.head.repo.full_name != github.repository }}
    uses: bitwarden/gh-actions/.github/workflows/check-run.yml@main
    permissions:
      contents: read

  remove-label:
    name: Remove signed build label
    needs: check-run
    runs-on: ubuntu-24.04
    permissions:
      pull-requests: write
    steps:
      - name: Remove label
        env:
          GH_TOKEN: ${{ github.token }}
          _PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          if ! OUTPUT=$(gh api --method DELETE "repos/$GITHUB_REPOSITORY/issues/$_PR_NUMBER/labels/ci%3Asigned-build" 2>&1); then
            if [[ "$OUTPUT" == *"HTTP 404"* ]]; then
              echo "Label already removed."
            else
              echo "$OUTPUT"
              exit 1
            fi
          fi

  run-workflow:
    name: Run Build
    needs: check-run
    # Fork PRs need the labeled check-run to pass. Same-repo PRs skip check-run, since only users and apps
    # with write access can push their branches, and ignore labeled events so they don't build twice.
    if: >-
      ${{ !cancelled() && (
        needs.check-run.result == 'success' ||
        (needs.check-run.result == 'skipped'
          && github.event.pull_request.head.repo.full_name == github.repository
          && github.event.action != 'labeled')
      ) }}
    uses: ./.github/workflows/build.yml
    secrets: inherit
    permissions:
      contents: read
      id-token: write
